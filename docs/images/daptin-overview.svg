<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">A schema becomes a working backend with Daptin</title>
  <desc id="desc">A product schema is loaded by the Daptin server. Daptin applies storage, permissions, validation, and events, then exposes JSON API, actions, realtime updates, and API discovery endpoints.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#858585"/>
    </marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .label{font-size:13px;font-weight:650;letter-spacing:.7px;fill:#666}
      .title{font-size:24px;font-weight:700;fill:#202020}
      .body{font-size:15px;fill:#555}
      .code{font-size:14px;fill:#303030}
      .muted{fill:#7a7a7a}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="538" rx="12" fill="#FAFAF8" stroke="#DEDEDA" stroke-width="2"/>

  <!-- Input: an actual Daptin schema -->
  <g transform="translate(48 50)">
    <text class="sans label" x="0" y="0">01 / DEFINE</text>
    <text class="sans title" x="0" y="35">Describe your data</text>
    <rect x="0" y="62" width="322" height="350" rx="8" fill="#FFF" stroke="#D8D8D3"/>
    <rect x="0" y="62" width="322" height="42" rx="8" fill="#F1F1EE"/>
    <path d="M0 96h322" stroke="#D8D8D3"/>
    <circle cx="20" cy="83" r="4" fill="#D0D0CB"/>
    <circle cx="34" cy="83" r="4" fill="#D0D0CB"/>
    <text class="mono" x="50" y="88" font-size="13" fill="#666">schema_product.yaml</text>

    <g class="mono code">
      <text x="20" y="132"><tspan fill="#379CBD">Tables</tspan><tspan>:</tspan></text>
      <text x="20" y="158">  - <tspan fill="#379CBD">TableName</tspan>: product</text>
      <text x="20" y="184">    <tspan fill="#379CBD">Columns</tspan>:</text>
      <text x="20" y="210">      - <tspan fill="#379CBD">Name</tspan>: name</text>
      <text x="20" y="236">        <tspan fill="#379CBD">DataType</tspan>: varchar</text>
      <text x="20" y="262">      - <tspan fill="#379CBD">Name</tspan>: price</text>
      <text x="20" y="288">        <tspan fill="#379CBD">DataType</tspan>: float</text>
      <text x="20" y="314">      - <tspan fill="#379CBD">Name</tspan>: published</text>
      <text x="20" y="340">        <tspan fill="#379CBD">DataType</tspan>: bool</text>
      <text x="20" y="376" class="muted"># add relations, validation,</text>
      <text x="20" y="398" class="muted"># actions, and permissions</text>
    </g>
  </g>

  <!-- The server -->
  <path d="M395 270h55" fill="none" stroke="#858585" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="sans" x="422" y="251" text-anchor="middle" font-size="12" fill="#777">load</text>

  <g transform="translate(468 112)">
    <text class="sans label" x="0" y="0">02 / RUN</text>
    <rect x="0" y="25" width="264" height="306" rx="8" fill="#242424"/>
    <rect x="0" y="25" width="8" height="153" rx="4" fill="#379CBD"/>
    <rect x="0" y="178" width="8" height="153" rx="4" fill="#FF9B00"/>

    <g transform="translate(30 59)">
      <path d="M3 18 17 3l7 20Z" fill="none" stroke="#379CBD" stroke-width="4" stroke-linejoin="round"/>
      <path d="M14 31 28 17l7 20Z" fill="none" stroke="#FF9B00" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-5 33 8 19l5 20Z" fill="none" stroke="#BEBEBE" stroke-width="4" stroke-linejoin="round"/>
      <text class="sans" x="52" y="30" font-size="29" font-weight="700" fill="#FFF">daptin</text>
    </g>

    <text class="sans" x="30" y="131" font-size="14" fill="#BDBDBD">Application server</text>
    <path d="M30 154h204" stroke="#4A4A4A"/>
    <g class="sans" font-size="15" fill="#F0F0F0">
      <text x="30" y="185">Storage</text><text x="234" y="185" text-anchor="end" fill="#A9A9A9">SQL</text>
      <text x="30" y="221">Access control</text><text x="234" y="221" text-anchor="end" fill="#A9A9A9">users + groups</text>
      <text x="30" y="257">Validation</text><text x="234" y="257" text-anchor="end" fill="#A9A9A9">per resource</text>
      <text x="30" y="293">Events</text><text x="234" y="293" text-anchor="end" fill="#A9A9A9">after CRUD</text>
    </g>
  </g>

  <!-- Output: the useful public surface -->
  <path d="M750 270h55" fill="none" stroke="#858585" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="sans" x="777" y="251" text-anchor="middle" font-size="12" fill="#777">serve</text>

  <g transform="translate(824 50)">
    <text class="sans label" x="0" y="0">03 / BUILD ON IT</text>
    <text class="sans title" x="0" y="35">Use the backend</text>

    <g transform="translate(0 68)">
      <rect width="328" height="64" rx="7" fill="#FFF" stroke="#D8D8D3"/>
      <rect x="14" y="17" width="48" height="28" rx="4" fill="#E8F4F7"/>
      <text class="mono" x="38" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#247E9B">GET</text>
      <text class="mono code" x="78" y="37">/api/product</text>
    </g>
    <g transform="translate(0 144)">
      <rect width="328" height="64" rx="7" fill="#FFF" stroke="#D8D8D3"/>
      <rect x="14" y="17" width="48" height="28" rx="4" fill="#FFF0DA"/>
      <text class="mono" x="38" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#A86300">POST</text>
      <text class="mono" x="78" y="30" font-size="13" fill="#303030">/action/product/</text>
      <text class="mono" x="78" y="47" font-size="13" fill="#303030">publish</text>
    </g>
    <g transform="translate(0 220)">
      <rect width="328" height="64" rx="7" fill="#FFF" stroke="#D8D8D3"/>
      <text class="mono" x="18" y="38" font-size="14" fill="#303030">WS  /live</text>
      <text class="sans" x="310" y="38" text-anchor="end" font-size="13" fill="#777">realtime</text>
    </g>
    <g transform="translate(0 296)">
      <rect width="328" height="64" rx="7" fill="#FFF" stroke="#D8D8D3"/>
      <text class="mono code" x="18" y="38">/openapi.yaml</text>
      <text class="sans" x="310" y="38" text-anchor="end" font-size="13" fill="#777">discovery</text>
    </g>
  </g>
</svg>
