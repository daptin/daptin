<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How the Daptin application server fits together</title>
  <desc id="desc">Schema and configuration load into CmsConfig and the world metadata table. Daptin creates a resource for every entity. A shared request pipeline applies table permissions, row permissions, metering, validation, data exchange, YJS behavior, and CRUD event publishing. The resource graph powers JSON API, GraphQL, actions, state tracking, assets, integrations, LLM APIs, WebSockets, feeds, templates, sites, and built-in protocols.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#172733"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183D4E"/><stop offset="1" stop-color="#1A2C38"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#379CBD"/><stop offset="1" stop-color="#FF9B00"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#05090C" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#668090"/></marker>
    <style>
      .f{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.eye{font-size:11px;font-weight:800;letter-spacing:1.8px;fill:#7E98A8}.h1{font-size:24px;font-weight:780;fill:#F8FBFC}.h2{font-size:17px;font-weight:740;fill:#F8FBFC}.h3{font-size:14px;font-weight:720;fill:#F8FBFC}.body{font-size:12px;font-weight:520;fill:#A9BCC7}.micro{font-size:10px;font-weight:650;fill:#8FA7B5}.card{fill:#1B2A35;stroke:#2E4350;stroke-width:1.2}.soft{fill:#21333F;stroke:#354B58;stroke-width:1}.line{fill:none;stroke:#668090;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#5C7585;stroke-width:1.7;stroke-dasharray:4 6}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1110" cy="-30" r="245" fill="#379CBD" opacity=".055"/><circle cx="40" cy="810" r="260" fill="#FF9B00" opacity=".045"/>
  <g class="f">
    <text x="54" y="48" class="eye">DAPTIN RUNTIME ARCHITECTURE</text>
    <text x="54" y="82" class="h1">One runtime brings your data, backend services, and protocols together.</text>

    <!-- Configuration -->
    <g transform="translate(54 116)">
      <rect width="1092" height="76" rx="17" class="card"/>
      <text x="22" y="28" class="eye">LOAD AT STARTUP</text>
      <text x="22" y="52" class="h3">Schema files</text><text x="115" y="52" class="body">YAML · JSON</text>
      <path d="M250 38h45" class="line" marker-end="url(#arrow)"/>
      <rect x="307" y="15" width="450" height="46" rx="13" fill="#213742" stroke="#3A5765"/>
      <text x="329" y="35" class="h3">CmsConfig</text>
      <text x="418" y="35" class="body">tables · relations · actions · tasks · state machines</text>
      <text x="329" y="52" class="body">imports · exchanges · streams · subsites · GraphQL flag · performers</text>
      <text x="802" y="28" class="h3">Runtime settings</text><text x="802" y="49" class="body">/_config</text>
      <path d="M888 38h39" class="line" marker-end="url(#arrow)"/>
      <rect x="939" y="15" width="131" height="46" rx="13" fill="#213742" stroke="#3A5765"/>
      <text x="1004.5" y="35" text-anchor="middle" class="h3">ConfigStore</text>
      <text x="1004.5" y="52" text-anchor="middle" class="micro">backend settings</text>
    </g>

    <!-- Core -->
    <g filter="url(#shadow)"><rect x="322" y="226" width="556" height="322" rx="25" fill="url(#core)" stroke="#3A5968" stroke-width="1.5"/><rect x="322" y="226" width="556" height="5" rx="2.5" fill="url(#accent)"/></g>
    <g transform="translate(350 254)">
      <path d="M2 12 18 1l5 20ZM7 31 21 20l5 20ZM-5 29 7 17l4 21Z" fill="none" stroke-width="3.5" stroke-linejoin="round" stroke="#379CBD"/>
      <path d="M7 31 21 20l5 20Z" stroke="#FF9B00"/>
      <text x="43" y="25" font-size="24" font-weight="800" fill="#FFF">Daptin resource runtime</text>
      <text x="43" y="45" class="body">Each configured table becomes a permission-aware API resource.</text>
    </g>

    <g transform="translate(350 320)">
      <rect width="150" height="74" rx="15" class="soft"/>
      <text x="17" y="25" class="eye">METADATA</text><text x="17" y="47" class="h2">world</text><text x="17" y="64" class="micro">schema JSON · table gate</text>
      <path d="M161 37h42" class="line" marker-end="url(#arrow)"/>
      <rect x="215" width="313" height="74" rx="15" class="soft"/>
      <text x="232" y="25" class="eye">GENERATED RESOURCE</text><text x="232" y="47" class="h2">/api/{entity}</text><text x="232" y="64" class="micro">CRUD · relations · filters · sorting · pagination</text>
    </g>

    <text x="350" y="425" class="eye">SHARED MIDDLEWARE · APPLIED BY OPERATION</text>
    <g transform="translate(350 442)">
      <rect width="500" height="76" rx="15" fill="#14232D" stroke="#304754"/>
      <g transform="translate(13 13)"><rect width="69" height="50" rx="11" fill="#20333F"/><text x="34.5" y="22" text-anchor="middle" class="micro">TABLE</text><text x="34.5" y="38" text-anchor="middle" class="micro">ACCESS</text></g>
      <path d="M89 38h17" class="dash"/>
      <g transform="translate(113 13)"><rect width="69" height="50" rx="11" fill="#20333F"/><text x="34.5" y="22" text-anchor="middle" class="micro">ROW</text><text x="34.5" y="38" text-anchor="middle" class="micro">ACCESS</text></g>
      <path d="M189 38h17" class="dash"/>
      <g transform="translate(213 13)"><rect width="78" height="50" rx="11" fill="#3A3123"/><text x="39" y="30" text-anchor="middle" class="micro" fill="#FFD28A">METERING</text></g>
      <path d="M298 38h17" class="dash"/>
      <g transform="translate(322 13)"><rect width="78" height="50" rx="11" fill="#20333F"/><text x="39" y="22" text-anchor="middle" class="micro">VALIDATE</text><text x="39" y="38" text-anchor="middle" class="micro">CONFORM</text></g>
      <path d="M407 38h17" class="dash"/>
      <g transform="translate(431 13)"><rect width="56" height="50" rx="11" fill="#20333F"/><text x="28" y="22" text-anchor="middle" class="micro">SYNC</text><text x="28" y="38" text-anchor="middle" class="micro">EVENTS</text></g>
    </g>

    <!-- Left system tables -->
    <text x="54" y="230" class="eye">DATA-MANAGED SUBSYSTEMS</text>
    <g transform="translate(54 250)">
      <rect width="232" height="124" rx="17" class="card"/>
      <text x="18" y="27" class="h3">Identity &amp; policy</text>
      <text x="18" y="51" class="body">user_account · usergroup</text><text x="18" y="71" class="body">JWT · OTP · OAuth client</text><text x="18" y="91" class="body">OAuth/OIDC provider tables</text><text x="18" y="111" class="body">table · row · action permissions</text>
    </g>
    <g transform="translate(54 390)">
      <rect width="232" height="124" rx="17" class="card"/>
      <text x="18" y="27" class="h3">Logic &amp; tracking</text>
      <text x="18" y="51" class="body">action · task · smd</text><text x="18" y="71" class="body">performers · action outcomes</text><text x="18" y="91" class="body">data_exchange · stream · feed</text><text x="18" y="111" class="body">timeline · generated audit tables</text>
    </g>
    <path d="M286 312h24M286 452h24" class="dash" marker-end="url(#arrow)"/>

    <!-- Right system tables -->
    <g transform="translate(914 250)">
      <rect width="232" height="124" rx="17" class="card"/>
      <text x="18" y="27" class="h3">Content &amp; storage</text>
      <text x="18" y="51" class="body">credential · cloud_store</text><text x="18" y="71" class="body">asset columns · document</text><text x="18" y="91" class="body">site · template · collection</text><text x="18" y="111" class="body">rclone stores · hosted subsites</text>
    </g>
    <g transform="translate(914 390)">
      <rect width="232" height="124" rx="17" class="card"/>
      <text x="18" y="27" class="h3">Providers &amp; product</text>
      <text x="18" y="51" class="body">integration · oauth_token</text><text x="18" y="71" class="body">llm_provider · llm_usage</text><text x="18" y="91" class="body">api_plan · member · usage · quota</text><text x="18" y="111" class="body">mail_server · account · box · outbox</text>
    </g>
    <path d="M890 312h12M890 452h12" class="dash" marker-end="url(#arrow)"/>

    <!-- Surface rail -->
    <text x="54" y="596" class="eye">SURFACES ATTACHED TO THE SAME RESOURCE GRAPH</text>
    <g transform="translate(54 615)">
      <rect width="1092" height="92" rx="18" fill="#121F28" stroke="#2B414E"/>
      <g transform="translate(17 16)"><rect width="123" height="60" rx="13" class="soft"/><text x="61.5" y="25" text-anchor="middle" class="h3">Data APIs</text><text x="61.5" y="45" text-anchor="middle" class="micro">JSON:API · GraphQL</text></g>
      <g transform="translate(151 16)"><rect width="123" height="60" rx="13" class="soft"/><text x="61.5" y="25" text-anchor="middle" class="h3">Discovery</text><text x="61.5" y="45" text-anchor="middle" class="micro">OpenAPI · meta</text></g>
      <g transform="translate(285 16)"><rect width="123" height="60" rx="13" class="soft"/><text x="61.5" y="25" text-anchor="middle" class="h3">Actions</text><text x="61.5" y="45" text-anchor="middle" class="micro">/action · /track</text></g>
      <g transform="translate(419 16)"><rect width="123" height="60" rx="13" class="soft"/><text x="61.5" y="25" text-anchor="middle" class="h3">Files &amp; sites</text><text x="61.5" y="45" text-anchor="middle" class="micro">assets · templates</text></g>
      <g transform="translate(553 16)"><rect width="123" height="60" rx="13" class="soft"/><text x="61.5" y="25" text-anchor="middle" class="h3">Realtime</text><text x="61.5" y="45" text-anchor="middle" class="micro">/live · YJS · feeds</text></g>
      <g transform="translate(687 16)"><rect width="123" height="60" rx="13" class="soft"/><text x="61.5" y="25" text-anchor="middle" class="h3">Providers</text><text x="61.5" y="45" text-anchor="middle" class="micro">/integration · /v1</text></g>
      <g transform="translate(821 16)"><rect width="123" height="60" rx="13" class="soft"/><text x="61.5" y="25" text-anchor="middle" class="h3">Protocols</text><text x="61.5" y="45" text-anchor="middle" class="micro">mail · FTP · WebDAV</text></g>
      <g transform="translate(955 16)"><rect width="120" height="60" rx="13" class="soft"/><text x="60" y="25" text-anchor="middle" class="h3">Operations</text><text x="60" y="45" text-anchor="middle" class="micro">ping · stats · TLS</text></g>
    </g>

    <!-- Persistence -->
    <text x="600" y="578" text-anchor="middle" class="micro">SQLite · PostgreSQL · MySQL/MariaDB  |  Olric cache/PubSub  |  rclone-backed storage</text>
  </g>
</svg>
