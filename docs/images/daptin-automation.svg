<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">How actions, scheduled tasks, and state tracking differ</title>
  <desc id="desc">An action runs ordered backend work after checking access and inputs. A scheduled task calls the same action as a selected user. State tracking validates and records allowed changes, but it does not run actions automatically.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#858585"/>
    </marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:13px;font-weight:650;letter-spacing:.7px;fill:#666}
      .title{font-size:30px;font-weight:700;fill:#202020}
      .head{font-size:20px;font-weight:700;fill:#242424}
      .body{font-size:15px;fill:#626262}
      .small{font-size:13px;fill:#757575}
      .darkhead{font-size:20px;font-weight:700;fill:#FFF}
      .darksmall{font-size:13px;fill:#BDBDBD}
      .code{font-size:14px;fill:#303030}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="698" rx="12" fill="#FAFAF8" stroke="#DEDEDA" stroke-width="2"/>
  <text class="sans eyebrow" x="48" y="49">DAPTIN / AUTOMATION</text>
  <text class="sans title" x="48" y="88">Three tools, three different jobs</text>
  <text class="sans body" x="48" y="117">Actions do work. Tasks decide when to run it. State tracking records allowed changes.</text>
  <path d="M48 145h1104" stroke="#D8D8D3"/>

  <!-- Actions -->
  <g transform="translate(48 178)">
    <rect width="1104" height="166" rx="8" fill="#FFF" stroke="#D8D8D3"/>
    <rect width="6" height="166" rx="3" fill="#FF9B00"/>
    <text class="sans eyebrow" x="24" y="32" fill="#A86300">ACTION</text>
    <text class="sans head" x="24" y="65">Run backend work</text>
    <text class="sans small" x="24" y="91">Example: approve an order</text>

    <g transform="translate(260 47)">
      <rect width="245" height="72" rx="7" fill="#FAFAF8" stroke="#D8D8D3"/>
      <text class="mono code" x="18" y="31">POST /action/order/</text>
      <text class="mono code" x="18" y="52">approve</text>
    </g>
    <path d="M517 83h48" fill="none" stroke="#858585" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(579 47)">
      <rect width="210" height="72" rx="7" fill="#FAFAF8" stroke="#D8D8D3"/>
      <text class="sans" x="18" y="30" font-size="15" font-weight="650" fill="#303030">Check access + input</text>
      <text class="sans small" x="18" y="52">validate, conform, meter</text>
    </g>
    <path d="M801 83h48" fill="none" stroke="#858585" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(863 47)">
      <rect width="217" height="72" rx="7" fill="#FFF7E9" stroke="#E9D2AB"/>
      <text class="sans" x="18" y="30" font-size="15" font-weight="650" fill="#303030">Run steps in order</text>
      <text class="sans small" x="18" y="52">CRUD, performer, response</text>
    </g>
  </g>

  <!-- Scheduled tasks -->
  <g transform="translate(48 360)">
    <rect width="1104" height="126" rx="8" fill="#FFF" stroke="#D8D8D3"/>
    <rect width="6" height="126" rx="3" fill="#379CBD"/>
    <text class="sans eyebrow" x="24" y="32" fill="#247E9B">SCHEDULED TASK</text>
    <text class="sans head" x="24" y="65">Run an action later</text>
    <text class="sans small" x="24" y="91">Stored in the task table</text>

    <g transform="translate(310 28)">
      <rect width="188" height="70" rx="7" fill="#EAF5F8" stroke="#C8DFE6"/>
      <text class="mono" x="18" y="30" font-size="14" fill="#303030">0 9 * * *</text>
      <text class="sans small" x="18" y="51">every day at 09:00</text>
    </g>
    <path d="M510 63h56" fill="none" stroke="#858585" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(580 28)">
      <rect width="208" height="70" rx="7" fill="#FAFAF8" stroke="#D8D8D3"/>
      <text class="sans" x="18" y="30" font-size="15" font-weight="650" fill="#303030">Load the selected user</text>
      <text class="sans small" x="18" y="51">identity + groups</text>
    </g>
    <path d="M800 63h56" fill="none" stroke="#858585" stroke-width="1.5" marker-end="url(#arrow)"/>
    <g transform="translate(870 28)">
      <rect width="210" height="70" rx="7" fill="#FAFAF8" stroke="#D8D8D3"/>
      <text class="sans" x="18" y="30" font-size="15" font-weight="650" fill="#303030">Call the same action</text>
      <text class="sans small" x="18" y="51">inside a transaction</text>
    </g>
  </g>

  <!-- State tracking -->
  <g transform="translate(48 502)">
    <rect width="1104" height="150" rx="8" fill="#242424"/>
    <rect width="6" height="150" rx="3" fill="#8D8D8D"/>
    <text class="sans eyebrow" x="24" y="32" fill="#BDBDBD">STATE TRACKING</text>
    <text class="sans darkhead" x="24" y="65">Record valid changes</text>
    <text class="sans darksmall" x="24" y="91">Example: the life of an order</text>

    <g transform="translate(342 39)">
      <rect width="104" height="46" rx="23" fill="#393939" stroke="#606060"/>
      <text class="mono" x="52" y="29" text-anchor="middle" font-size="14" fill="#FFF">new</text>
      <path d="M116 23h52" fill="none" stroke="#9A9A9A" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="182" width="104" height="46" rx="23" fill="#393939" stroke="#379CBD"/>
      <text class="mono" x="234" y="29" text-anchor="middle" font-size="14" fill="#FFF">paid</text>
      <path d="M298 23h52" fill="none" stroke="#9A9A9A" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="364" width="104" height="46" rx="23" fill="#393939" stroke="#FF9B00"/>
      <text class="mono" x="416" y="29" text-anchor="middle" font-size="14" fill="#FFF">shipped</text>
    </g>

    <g transform="translate(832 27)">
      <path d="M0 0h248v96H0Z" fill="#303030" stroke="#555"/>
      <text class="sans" x="16" y="28" font-size="14" font-weight="650" fill="#FFF">What it does</text>
      <text class="sans darksmall" x="16" y="52">validates + records transitions</text>
      <text class="sans" x="16" y="78" font-size="13" fill="#FFBD59">It does not run an action.</text>
    </g>
  </g>
</svg>
