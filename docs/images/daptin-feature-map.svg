<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">What is built into Daptin</title>
  <desc id="desc">A visual index of Daptin features: data modeling, APIs, users and access, backend jobs, files and sites, realtime protocols, integrations, and production operations.</desc>
  <defs>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:13px;font-weight:650;letter-spacing:.7px;fill:#666}
      .title{font-size:30px;font-weight:700;fill:#202020}
      .head{font-size:20px;font-weight:700;fill:#242424}
      .body{font-size:15px;fill:#626262}
      .number{font-size:13px;font-weight:700}
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="778" rx="12" fill="#FAFAF8" stroke="#DEDEDA" stroke-width="2"/>
  <text class="sans eyebrow" x="48" y="49">DAPTIN / BUILT IN</text>
  <text class="sans title" x="48" y="88">The pieces of a backend, in one server</text>
  <text class="sans body" x="48" y="117">Start with a data model. Use the rest when the application needs it.</text>
  <path d="M48 145h1104" stroke="#D8D8D3"/>

  <!-- Left column -->
  <g transform="translate(48 178)">
    <g>
      <rect width="532" height="126" rx="8" fill="#FFF" stroke="#D8D8D3"/>
      <rect width="6" height="126" rx="3" fill="#379CBD"/>
      <text class="sans number" x="24" y="31" fill="#247E9B">01</text>
      <text class="sans head" x="62" y="33">Data model</text>
      <text class="sans body" x="62" y="67">Tables, fields, relations, validation</text>
      <text class="sans body" x="62" y="94">Import, export, translations, audit history</text>
    </g>

    <g transform="translate(0 142)">
      <rect width="532" height="126" rx="8" fill="#FFF" stroke="#D8D8D3"/>
      <rect width="6" height="126" rx="3" fill="#379CBD"/>
      <text class="sans number" x="24" y="31" fill="#247E9B">03</text>
      <text class="sans head" x="62" y="33">Users and access</text>
      <text class="sans body" x="62" y="67">Login, groups, ownership, row permissions</text>
      <text class="sans body" x="62" y="94">JWT, OAuth clients, OAuth 2 and OIDC provider</text>
    </g>

    <g transform="translate(0 284)">
      <rect width="532" height="126" rx="8" fill="#FFF" stroke="#D8D8D3"/>
      <rect width="6" height="126" rx="3" fill="#379CBD"/>
      <text class="sans number" x="24" y="31" fill="#247E9B">05</text>
      <text class="sans head" x="62" y="33">Files and sites</text>
      <text class="sans body" x="62" y="67">Uploads, asset fields, local or cloud storage</text>
      <text class="sans body" x="62" y="94">Templates, static sites, caching and sync</text>
    </g>

    <g transform="translate(0 426)">
      <rect width="532" height="126" rx="8" fill="#FFF" stroke="#D8D8D3"/>
      <rect width="6" height="126" rx="3" fill="#379CBD"/>
      <text class="sans number" x="24" y="31" fill="#247E9B">07</text>
      <text class="sans head" x="62" y="33">Integrations</text>
      <text class="sans body" x="62" y="67">OpenAPI services as actions, OAuth credentials</text>
      <text class="sans body" x="62" y="94">REST, GraphQL, gRPC and LLM providers</text>
    </g>
  </g>

  <!-- Right column -->
  <g transform="translate(620 178)">
    <g>
      <rect width="532" height="126" rx="8" fill="#FFF" stroke="#D8D8D3"/>
      <rect width="6" height="126" rx="3" fill="#FF9B00"/>
      <text class="sans number" x="24" y="31" fill="#A86300">02</text>
      <text class="sans head" x="62" y="33">APIs</text>
      <text class="sans body" x="62" y="67">JSON:API, GraphQL and aggregate queries</text>
      <text class="sans body" x="62" y="94">OpenAPI, metadata and JavaScript models</text>
    </g>

    <g transform="translate(0 142)">
      <rect width="532" height="126" rx="8" fill="#FFF" stroke="#D8D8D3"/>
      <rect width="6" height="126" rx="3" fill="#FF9B00"/>
      <text class="sans number" x="24" y="31" fill="#A86300">04</text>
      <text class="sans head" x="62" y="33">Backend jobs</text>
      <text class="sans body" x="62" y="67">Actions, scheduled tasks and data exchange</text>
      <text class="sans body" x="62" y="94">State tracking and reusable Go performers</text>
    </g>

    <g transform="translate(0 284)">
      <rect width="532" height="126" rx="8" fill="#FFF" stroke="#D8D8D3"/>
      <rect width="6" height="126" rx="3" fill="#FF9B00"/>
      <text class="sans number" x="24" y="31" fill="#A86300">06</text>
      <text class="sans head" x="62" y="33">Realtime and protocols</text>
      <text class="sans body" x="62" y="67">WebSockets, Yjs collaboration and feeds</text>
      <text class="sans body" x="62" y="94">Mail, FTP and WebDAV-style routes</text>
    </g>

    <g transform="translate(0 426)">
      <rect width="532" height="126" rx="8" fill="#FFF" stroke="#D8D8D3"/>
      <rect width="6" height="126" rx="3" fill="#FF9B00"/>
      <text class="sans number" x="24" y="31" fill="#A86300">08</text>
      <text class="sans head" x="62" y="33">Running in production</text>
      <text class="sans body" x="62" y="67">Metering, quotas, rate limits and audit logs</text>
      <text class="sans body" x="62" y="94">Clustering, cache, TLS, health and statistics</text>
    </g>
  </g>

  <text class="mono" x="48" y="754" font-size="13" fill="#777">SQLite  ·  PostgreSQL  ·  MySQL / MariaDB</text>
</svg>
