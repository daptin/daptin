<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://daptin.github.io/">
  <title>Daptin has moved</title>
  <script>
    const section = location.pathname.replace(/^\/daptin\/?/, "").split("/")[0];
    const routes = new Set(["features", "platform", "use-cases", "open-source"]);
    const path = routes.has(section) ? `/${section}/` : "/";
    location.replace(`https://daptin.github.io${path}${location.search}${location.hash}`);
  </script>
</head>
<body>
  <p>Daptin has moved to <a href="https://daptin.github.io/">daptin.github.io</a>.</p>
</body>
</html>
