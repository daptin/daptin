changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - question
      - wontfix
      - wip
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - regression bug
    - title: Dependencies
      labels:
        - dependencies
    - title: Documentation
      labels:
        - documentation-needed
        - how-to-use
    - title: Other changes
      labels:
        - '*'
