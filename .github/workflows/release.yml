name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.12.27
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GO111MODULE: on
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install release tools
        run: |
          go install github.com/GeertJohan/go.rice/rice@v1.0.3
          go install github.com/crazy-max/xgo@v0.41.0
          go install github.com/ahmetb/govvv@v0.3.0

      - name: Build dashboard assets
        run: |
          wget -q https://github.com/artpar/dashboard3/releases/latest/download/shadcn-admin.zip
          unzip -q shadcn-admin.zip -d daptinweb
          rm shadcn-admin.zip
          "$(go env GOPATH)/bin/rice" embed-go

      - name: Cross-compile daptin
        run: |
          "$(go env GOPATH)/bin/xgo" -go go-1.25.x -targets=linux/amd64,linux/arm64 \
            --tags netgo -ldflags '-linkmode external' -dest build .
          "$(go env GOPATH)/bin/xgo" -go go-1.25.x -targets='darwin/amd64,darwin/arm64,windows/*' \
            --tags netgo -ldflags '-linkmode external' -dest build .

      - name: List built artifacts
        run: |
          find build -maxdepth 1 -type f -print -exec file {} \;

      - name: Upload linux amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: daptin-linux-amd64
          path: build/daptin-linux-amd64

      - name: Upload linux arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: daptin-linux-arm64
          path: build/daptin-linux-arm64

      - name: Upload darwin amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: daptin-darwin-amd64
          path: build/daptin-darwin-amd64

      - name: Upload darwin arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: daptin-darwin-arm64
          path: build/daptin-darwin-arm64

      - name: Upload windows amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: daptin-windows-amd64.exe
          path: build/daptin-windows-amd64.exe

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: |
            ./build/daptin-linux-amd64
            ./build/daptin-darwin-amd64
            ./build/daptin-linux-arm64
            ./build/daptin-windows-amd64.exe

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            daptin/daptin:${{ env.RELEASE_TAG }}
            daptin/daptin:latest
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Verify published image platforms
        run: docker buildx imagetools inspect "daptin/daptin:${RELEASE_TAG}"
