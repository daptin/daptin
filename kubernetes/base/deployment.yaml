apiVersion: apps/v1
kind: Deployment
metadata:
  name: daptin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: daptin
      app.kubernetes.io/instance: daptin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daptin
        app.kubernetes.io/instance: daptin
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: daptin
          image: daptin/daptin:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: daptin
          env:
            - name: DAPTIN_DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: daptin-database
                  key: connection-string
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: olric
              containerPort: 5336
              protocol: TCP
            - name: olric-member
              containerPort: 5337
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/daptin/storage
            - name: cache
              mountPath: /var/cache/daptin
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: daptin-data
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
