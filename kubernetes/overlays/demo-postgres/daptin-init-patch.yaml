apiVersion: apps/v1
kind: Deployment
metadata:
  name: daptin
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-bookworm
          command:
            - /bin/sh
            - -ec
            - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: daptin-postgres
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: daptin-postgres
                  key: username
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
